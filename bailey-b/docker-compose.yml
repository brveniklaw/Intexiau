# Local stand-in for Supabase: `docker compose --profile pgvector up -d`.
# Production uses the BALS-owned Supabase project (paid plan, no auto-pause).
# The qdrant profile is kept only as an alternative backend.
services:
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  pgvector:
    profiles: ["pgvector"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bailey
      POSTGRES_PASSWORD: bailey
      POSTGRES_DB: bailey_b
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
